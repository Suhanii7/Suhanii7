<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-labelledby="t">
  <title id="t">Let's build something together</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#EC6288"/><stop offset="1" stop-color="#F2C46D"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="120" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .w1 { animation: drift 10s linear infinite; } .w2 { animation: drift 15s linear infinite reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    .pulse { animation: tw 1.8s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .w1, .w2, .pulse { animation: none; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="120" fill="#150f1e"/>
    <g class="w2" opacity=".35"><path d="M0 78 Q150 54 300 78 T600 78 T900 78 T1200 78 T1500 78 T1800 78 V120 H0Z" fill="#7FD6C8"/></g>
    <g class="w1" opacity=".55"><path d="M0 92 Q150 72 300 92 T600 92 T900 92 T1200 92 T1500 92 T1800 92 V120 H0Z" fill="#EC6288"/></g>
  </g>
  <rect x="1" y="1" width="1198" height="118" rx="17" fill="none" stroke="#fff" stroke-opacity=".1"/>
  <circle cx="64" cy="40" r="5" fill="#7FD6C8" class="pulse"/>
  <text x="82" y="45" class="mono" font-size="15" fill="#D9CDD3">thanks for stopping by</text>
  <text x="1136" y="46" text-anchor="end" class="sans" font-size="20" font-weight="600" fill="url(#g)">Let's build something together.</text>
</svg>
