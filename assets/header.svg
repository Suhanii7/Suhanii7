<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Suhani Kumari, Software Development Engineer</title>
  <desc id="d">Animated night-garden banner with a glowing moon and fireflies, the name Suhani Kumari, and a rotating list of roles: Software Development Engineer, AI agent builder, Azure pipeline plumber, Full-stack C# .NET Python.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1429"/><stop offset="1" stop-color="#110c19"/></linearGradient>
    <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#F6EAEF"/><stop offset="1" stop-color="#F898B2"/></linearGradient>
    <radialGradient id="moonglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F2C46D" stop-opacity=".38"/><stop offset="1" stop-color="#F2C46D" stop-opacity="0"/></radialGradient>
    <radialGradient id="fly" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F2C46D"/><stop offset="1" stop-color="#F2C46D" stop-opacity="0"/></radialGradient>
    <radialGradient id="flyT" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7FD6C8"/><stop offset="1" stop-color="#7FD6C8" stop-opacity="0"/></radialGradient>
    <mask id="crescent"><rect width="1200" height="320" fill="#fff"/><circle cx="1018" cy="112" r="70" fill="#000"/></mask>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .role { opacity: 0; animation: show 12s infinite both; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
    @keyframes show { 0% { opacity: 0; transform: translateY(10px); } 4% { opacity: 1; transform: translateY(0); } 22% { opacity: 1; transform: translateY(0); } 26% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 0; } }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); opacity: .9; } 50% { transform: translate(14px, -18px); opacity: .35; } }
    .ff { animation: drift 6s ease-in-out infinite; }
    .f2 { animation-duration: 7.5s; animation-delay: -2s; } .f3 { animation-duration: 5s; animation-delay: -1s; }
    .f4 { animation-duration: 8s; animation-delay: -4s; } .f5 { animation-duration: 6.5s; animation-delay: -3s; } .f6 { animation-duration: 9s; animation-delay: -5s; }
    .tw { animation: tw 3s ease-in-out infinite; } .t2 { animation-delay: -1s; } .t3 { animation-delay: -2s; }
    @keyframes tw { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .pulse { animation: tw 1.6s ease-in-out infinite; }
    .cursor { animation: tw 1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .role, .ff, .tw, .pulse, .cursor { animation: none; } .r1 { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="990" cy="130" r="210" fill="url(#moonglow)"/>
    <!-- stars -->
    <g fill="#F6EAEF">
      <circle class="tw" cx="640" cy="52" r="1.6"/><circle class="tw t2" cx="720" cy="120" r="1.2"/><circle class="tw t3" cx="780" cy="40" r="1.8"/>
      <circle class="tw t2" cx="1130" cy="60" r="1.5"/><circle class="tw" cx="1160" cy="190" r="1.2"/><circle class="tw t3" cx="870" cy="270" r="1.4"/>
      <circle class="tw" cx="1080" cy="280" r="1.6"/><circle class="tw t2" cx="660" cy="250" r="1.2"/>
    </g>
    <!-- moon -->
    <circle cx="990" cy="130" r="78" fill="#F2C46D" mask="url(#crescent)"/>
    <!-- garden silhouette -->
    <path d="M0 320 V270 Q60 236 130 268 T270 262 T420 272 T600 258 T800 276 T1000 262 T1200 270 V320Z" fill="#150f1e"/>
    <path d="M0 320 V292 Q90 270 180 292 T380 288 T620 296 T860 286 T1200 294 V320Z" fill="#0e0a15"/>
    <!-- flowers -->
    <g stroke="#7FD6C8" stroke-width="2" fill="none" opacity=".7"><path d="M860 320 V262"/><path d="M905 320 V272"/><path d="M1085 320 V258"/></g>
    <g fill="#EC6288"><circle cx="860" cy="258" r="7"/><circle cx="905" cy="268" r="6"/><circle cx="1085" cy="254" r="7"/></g>
    <g fill="#F2C46D"><circle cx="860" cy="258" r="2.6"/><circle cx="905" cy="268" r="2.2"/><circle cx="1085" cy="254" r="2.6"/></g>
    <!-- fireflies -->
    <g>
      <g class="ff"><circle cx="760" cy="200" r="9" fill="url(#fly)"/><circle cx="760" cy="200" r="2.2" fill="#F2C46D"/></g>
      <g class="ff f2"><circle cx="840" cy="150" r="8" fill="url(#flyT)"/><circle cx="840" cy="150" r="2" fill="#7FD6C8"/></g>
      <g class="ff f3"><circle cx="1130" cy="140" r="9" fill="url(#fly)"/><circle cx="1130" cy="140" r="2.2" fill="#F2C46D"/></g>
      <g class="ff f4"><circle cx="930" cy="215" r="8" fill="url(#flyT)"/><circle cx="930" cy="215" r="2" fill="#7FD6C8"/></g>
      <g class="ff f5"><circle cx="700" cy="80" r="8" fill="url(#fly)"/><circle cx="700" cy="80" r="2" fill="#F2C46D"/></g>
      <g class="ff f6"><circle cx="1050" cy="215" r="9" fill="url(#flyT)"/><circle cx="1050" cy="215" r="2.2" fill="#7FD6C8"/></g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#ffffff" stroke-opacity=".1"/>

  <!-- status pill -->
  <g transform="translate(64 50)">
    <rect width="372" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <circle cx="18" cy="15" r="4.5" fill="#7FD6C8" class="pulse"/>
    <text x="32" y="20" class="mono" font-size="12.5" fill="#D9CDD3">Software Development Engineer · Chandigarh, India</text>
  </g>

  <!-- name -->
  <text x="62" y="152" class="sans" font-size="74" font-weight="700" fill="url(#name)" letter-spacing="-2">Suhani</text>
  <text x="318" y="152" class="serif" font-size="74" fill="#EC6288">Kumari</text>

  <!-- rotating roles -->
  <g class="mono" font-size="24" fill="#F6EAEF">
    <text x="64" y="208" class="role r1">~/ Software Development Engineer<tspan class="cursor" fill="#F2C46D"> ▍</tspan></text>
    <text x="64" y="208" class="role r2">~/ AI agent builder<tspan class="cursor" fill="#F2C46D"> ▍</tspan></text>
    <text x="64" y="208" class="role r3">~/ Azure pipeline plumber<tspan class="cursor" fill="#F2C46D"> ▍</tspan></text>
    <text x="64" y="208" class="role r4">~/ Full-stack · C# · .NET · Python<tspan class="cursor" fill="#F2C46D"> ▍</tspan></text>
  </g>
  <text x="64" y="254" class="sans" font-size="16" fill="#A99AA3">AI agents · cloud pipelines · full-stack apps that quietly keep working</text>
</svg>
